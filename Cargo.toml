[workspace]
resolver = "2"
members = [
    "crates/dsp-core",
    "crates/rt-utils",
    "crates/platform-mac",
    "crates/audio-io",
    "crates/engine",
    "crates/engine-api",
    "crates/osc",
    "crates/analog",
    "crates/midi-xl",
    "crates/vst3-host",
    "crates/project",
    "crates/asset",
    "crates/render",
    "crates/ui-mixlink",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["MixLink contributors"]

[workspace.dependencies]
dsp-core = { path = "crates/dsp-core" }
rt-utils = { path = "crates/rt-utils" }
platform-mac = { path = "crates/platform-mac" }
audio-io = { path = "crates/audio-io" }
engine = { path = "crates/engine" }
engine-api = { path = "crates/engine-api" }
osc = { path = "crates/osc" }
analog = { path = "crates/analog" }
midi-xl = { path = "crates/midi-xl" }
vst3-host = { path = "crates/vst3-host" }
project = { path = "crates/project" }
asset = { path = "crates/asset" }
render = { path = "crates/render" }
ui-mixlink = { path = "crates/ui-mixlink" }

rtrb = "0.3"
arc-swap = "1.7"
crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"
atomic_float = "1"
num-traits = "0.2"
realfft = "3.3"
hound = "3.5"
rayon = "1.10"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
smallvec = { version = "1", features = ["const_generics"] }
arrayvec = "0.7"
bytemuck = { version = "1.16", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
libc = "0.2"
mach2 = "0.4"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSOpenPanel"] }
wgpu = "23"
winit = "0.30"
pollster = "0.3"
raw-window-handle = "0.6"
glyphon = "0.7"
socket2 = "0.5"
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package.dsp-core]
opt-level = 3
[profile.dev.package.engine]
opt-level = 3
[profile.dev.package.vst3-host]
opt-level = 3
